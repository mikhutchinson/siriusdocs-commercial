name: Published binary consumers
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release or draft candidate to verify
        required: true
        default: '0.1.0'
        type: string
  release:
    types: [published]
permissions:
  # GitHub restricts draft release visibility to write-capable repository tokens.
  # This workflow only downloads the same repository's immutable assets.
  contents: write
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download immutable wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '0.1.0' }}
        shell: bash
        run: gh release download "$RELEASE_TAG" --pattern '*.whl' --dir wheels
      - name: Install selected compiled wheel
        run: |
          python -m pip install --no-index --no-deps --find-links wheels sirius-docs==0.1.0
          python -m pip install 'sirius-docs[documents]==0.1.0'
      - run: python -I Examples/python_smoke.py
      - run: python -m pip check
